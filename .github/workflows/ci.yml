name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript strict check
        run: npm run typecheck
      - name: ESLint
        run: npx next lint
      - name: Stylelint (enforces design-token-only CSS, no raw hex/px/banned fonts)
        run: npx stylelint "**/*.css"
      - name: No em dash anywhere in the project (non-negotiable project rule)
        run: |
          if grep -rlP '\x{2014}' --include='*.ts' --include='*.tsx' --include='*.css' --include='*.md' --include='*.json' . ; then
            echo "Em dash (U+2014) found. This project bans em dashes with no exceptions, including code comments." >&2
            exit 1
          fi
      - name: Unit tests (Vitest)
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        run: npm run e2e
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}

  lighthouse:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI (3G-throttled, per DESIGN.md §6 / research doc §4.2)
        run: npx @lhci/cli autorun
